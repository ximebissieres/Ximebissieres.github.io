# =============================================================================
#  PROYECTOS · Fuente única de las tarjetas de la Home, el menú "Proyectos"
#  y la navegación entre casos. Guía completa: GUIA-DE-CONTENIDO.md
#
#  Qué cambia cada campo
#  - company .......... Empresa: tarjeta, menú, portada del caso y "Siguiente proyecto"
#  - category ......... Categoría junto a la empresa en la tarjeta (ej. "Delivery")
#  - name ............. Nombre del proyecto: título de la tarjeta y "Siguiente proyecto"
#  - teaser ........... Descripción de la tarjeta (máximo dos líneas, ~65 caracteres)
#  - menu ............. Segunda línea del proyecto en el menú desplegable
#  - sector ........... Etiqueta sobre el título en la página del caso
#  - title_html ....... Título grande del caso. *texto* se destaca en rosa
#  - cover ............ Imagen de la tarjeta y la portada ("illustration" = dibujo de Monchis)
#  - cover_alt ........ Descripción de la imagen para lectores de pantalla
#  - cover_position ... Encuadre de la imagen (horizontal vertical), ej. "50% 0%" = arriba
#  - card_cover ....... (Opcional) Imagen solo para la tarjeta de la home y "Siguiente proyecto".
#                       Si no existe, se usa cover. card_cover_alt: su descripción.
#  - order ............ Orden y número (01, 02…). Si reordenas, cambia también el orden
#                       de los bloques en este archivo.
#  - hero ............. (Opcional) Portada narrativa del caso: titulo, bajada,
#                       etiqueta_descripcion y descripcion. Hoy solo Monchis la usa.
#  - hero_layout ...... (Opcional) "navegador" muestra la captura de la portada del
#                       caso dentro de una ventana de navegador. Hoy lo usa LATAM.
#  - slug ............. Dirección de la página (/proyectos/slug/). NO cambiar.
# =============================================================================
- slug: monchis
  category: Delivery App
  teaser: Un checkout que ayuda a finalizar la compra, sin sumar fricción.
  order: 1
  company: Monchis
  sector: Delivery App · Paraguay
  name: Pagar sin sorpresas
  menu: Checkout
  title_html: Cómo rediseñamos el checkout para dar claridad y control *sin agregar fricción* a la compra
  cover: illustration
  card_cover: /assets/img/monchis-logo.webp
  card_cover_alt: Logo de Monchis sobre fondo rojo
  # Hero narrativo del caso (opcional). Si existe, reemplaza el título y el
  # resumen de la portada del caso. *texto* se destaca en rosa.
  hero:
    titulo: "Un checkout para pagar, // *no para volver a empezar*"   # *texto* = subrayado rosa · " // " = salto de línea
    bajada: "En Monchis, los pedidos podían ser con envío a domicilio, retiro en el local o agendados. Rediseñar el checkout implicaba adaptarlo a cada escenario, simplificar decisiones y mantener el foco en finalizar el pedido."
    # Imagen que reemplaza a la bajada (la bajada queda guardada arriba y vuelve
    # a mostrarse si borras este bloque). Composición por capas que se mueve
    # sutilmente con el cursor. x, y, ancho: posición en px dentro del lienzo
    # (ancho × alto). prof: cuánto se mueve la capa (negativo = sentido opuesto).
    composicion:
      ancho: 1659
      alto: 1158
      alt: "Nuevo checkout de Monchis en un iPhone, con tres componentes destacados: propina sugerida, método de pago con cupones aplicados y resumen del pedido con descuentos y total a pagar"
      capas:
        - { src: "/assets/img/monchis-hero-telefono.webp", x: 671, y: 20, ancho: 543, alto: 1118, prof: -6 }
        - { src: "/assets/img/monchis-hero-resumen.webp", x: 1022, y: 373, ancho: 617, alto: 660, prof: 16 }
        - { src: "/assets/img/monchis-hero-pago.webp", x: 263, y: 388, ancho: 573, alto: 521, prof: 20 }
        - { src: "/assets/img/monchis-hero-propina.webp", x: 20, y: 138, ancho: 487, alto: 287, prof: 26 }
    # Bloque lateral opcional: para mostrarlo, agrega etiqueta_descripcion y descripcion.
    # Pantallas reales de la portada (máximo 3). La primera es la protagonista.
    # ancho / alto: tamaño real de cada imagen (no cambiar si no cambias la imagen).
    # Para volver a mostrar la imagen de la portada, borra la línea siguiente o cámbiala a false.
    ocultar_imagen: true
    pantallas:
      - imagen: "/assets/img/monchis-checkout-envio-v2.webp"
        alt: "Checkout de Monchis con envío a domicilio: mapa para elegir el punto exacto de entrega, dirección, tiempo estimado de 30 a 60 minutos, detalle del pedido, propina sugerida de Gs. 2.000, inicio de ¿Cómo querés pagar? y footer fijo con el total y el botón Finalizar pedido"
        etiqueta: "Envío a domicilio"
        ancho: 923
        alto: 2000
      - imagen: "/assets/img/monchis-checkout-retiro.webp"
        alt: "Checkout de Monchis con retiro en el local: ubicación del comercio, aviso «Recordá retirar tu pedido cuando esté listo», tiempo de retiro, método de pago y footer fijo con el total y el botón Finalizar pedido"
        etiqueta: "Retiro en el local"
        ancho: 923
        alto: 2000
      - imagen: "/assets/img/monchis-checkout-agendado-v2.webp"
        alt: "Checkout de Monchis con pedido agendado para el lunes 18 de octubre de 8:00 a 9:00 h: mapa para elegir el punto exacto de entrega, dirección, detalle del pedido, propina sugerida de Gs. 2.000 y footer fijo con el total y el botón Finalizar pedido"
        etiqueta: "Pedido agendado"
        ancho: 923
        alto: 2000

