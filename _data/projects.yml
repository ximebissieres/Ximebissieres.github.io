# =============================================================================
#  PROYECTOS · Fuente única de las tarjetas de la Home, el menú "Proyectos"
#  y la navegación entre casos. Guía completa: GUIA-DE-CONTENIDO.md
#
#  Qué cambia cada campo
#  - company .......... Empresa: tarjeta, menú, portada del caso y "Siguiente proyecto"
#  - category ......... Categoría junto a la empresa en la tarjeta (ej. "Delivery")
#  - name ............. Nombre del proyecto: título de la tarjeta y "Siguiente proyecto"
#  - teaser ........... Descripción de la tarjeta (máximo dos líneas, ~65 caracteres)
#  - menu ............. Segunda línea del proyecto en el menú desplegable
#  - sector ........... Etiqueta sobre el título en la página del caso
#  - title_html ....... Título grande del caso. *texto* se destaca en rosa
#  - cover ............ Imagen de la tarjeta y la portada ("illustration" = dibujo de Monchis)
#  - cover_alt ........ Descripción de la imagen para lectores de pantalla
#  - cover_position ... Encuadre de la imagen (horizontal vertical), ej. "50% 0%" = arriba
#  - order ............ Orden y número (01, 02…). Si reordenas, cambia también el orden
#                       de los bloques en este archivo.
#  - slug ............. Dirección de la página (/proyectos/slug/). NO cambiar.
# =============================================================================
