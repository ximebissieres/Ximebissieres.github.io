# =============================================================================
#  PROYECTOS · Fuente única de las tarjetas de la Home, el menú "Proyectos"
#  y la navegación entre casos. Guía completa: GUIA-DE-CONTENIDO.md
#
#  Qué cambia cada campo
#  - company .......... Empresa: tarjeta, menú, portada del caso y "Siguiente proyecto"
#  - category ......... Categoría junto a la empresa en la tarjeta (ej. "Delivery")
#  - name ............. Nombre del proyecto: título de la tarjeta y "Siguiente proyecto"
#  - teaser ........... Descripción de la tarjeta (máximo dos líneas, ~65 caracteres)
#  - menu ............. Segunda línea del proyecto en el menú desplegable
#  - sector ........... Etiqueta sobre el título en la página del caso
#  - title_html ....... Título grande del caso. *texto* se destaca en rosa
#  - cover ............ Imagen de la tarjeta y la portada ("illustration" = dibujo de Monchis)
#  - cover_alt ........ Descripción de la imagen para lectores de pantalla
#  - cover_position ... Encuadre de la imagen (horizontal vertical), ej. "50% 0%" = arriba
#  - order ............ Orden y número (01, 02…). Si reordenas, cambia también el orden
#                       de los bloques en este archivo.
#  - hero ............. (Opcional) Portada narrativa del caso: titulo, bajada,
#                       etiqueta_descripcion y descripcion. Hoy solo Monchis la usa.
#  - hero_layout ...... (Opcional) "navegador" muestra la captura de la portada del
#                       caso dentro de una ventana de navegador. Hoy lo usa LATAM.
#  - slug ............. Dirección de la página (/proyectos/slug/). NO cambiar.
# =============================================================================
- slug: monchis
  category: Delivery App
  teaser: Un checkout que ayuda a finalizar la compra, sin sumar fricción.
  order: 1
  company: Monchis
  sector: Delivery App · Paraguay
  name: Rediseño del checkout
  menu: Checkout
  title_html: Cómo rediseñamos el checkout para dar claridad y control *sin agregar fricción* a la compra
  cover: illustration
  # Hero narrativo del caso (opcional). Si existe, reemplaza el título y el
  # resumen de la portada del caso. *texto* se destaca en rosa.
  hero:
    titulo: "Hacer simple la compra, incluso cuando *la operación no lo era.*"
    bajada: "Rediseñamos el checkout de Monchis para adaptarse a distintas modalidades de entrega y pedidos agendados, simplificando decisiones y manteniendo el foco en finalizar la compra."
    # Bloque lateral opcional: para mostrarlo, agrega etiqueta_descripcion y descripcion.
    # Pantallas reales de la portada (máximo 3). La primera es la protagonista.
    # ancho / alto: tamaño real de cada imagen (no cambiar si no cambias la imagen).
    pantallas:
      - imagen: "/assets/img/monchis-checkout-envio.webp"
        alt: "Checkout de Monchis con envío a domicilio: mapa para elegir el punto exacto de entrega, dirección, aviso «¡Estás lejos de esta ubicación! ¿Es para alguien más?», tiempo estimado e instrucciones para el repartidor"
        etiqueta: "Envío a domicilio"
        ancho: 455
        alto: 2000
      - imagen: "/assets/img/monchis-checkout-retiro.webp"
        alt: "Checkout de Monchis con retiro en el local: ubicación del comercio, aviso «Recordá retirar tu pedido cuando esté listo» y tiempo de retiro"
        etiqueta: "Retiro en el local"
        ancho: 595
        alto: 2000
      - imagen: "/assets/img/monchis-checkout-agendado.webp"
        alt: "Checkout de Monchis con pedido agendado: dirección de entrega y franja programada para el lunes 18 de octubre de 8:00 a 9:00 h"
        etiqueta: "Pedido agendado"
        ancho: 413
        alto: 2000
