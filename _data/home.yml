# --- 01 · Hero: presentación --------------------------------------------------
hero:
  etiqueta: "Ximena Bissieres · Product Designer & AI Prototyper"   # pastilla sobre el título
  titulo: "Transformo desafíos de negocio // en experiencias donde *el diseño, // el contenido y la IA trabajan juntos*"   # *texto* = subrayado rosa · " // " = salto de línea (solo en computador)
