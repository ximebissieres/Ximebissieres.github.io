  # "Identifico oportunidades y transformo problemas complejos en experiencias digitales claras y accesibles, conectando las necesidades de las personas con los objetivos del negocio."
  bajada: ""
  boton_principal: "Revisar proyectos"
  boton_secundario: "Contacto"
  foto: "/assets/foto.jpg"                      # para cambiar la foto, sube otra con este nombre
  foto_descripcion: "Ximena Bissieres trabajando en su computador, sonriendo y con audífonos"
  foto_iniciales: "XB"                          # se ve solo si la foto no carga
  herramientas:                                 # etiquetas bajo los botones
    - "Figma"
    - "Claude Code"
    - "Design Systems"
    - "Research"
  sticker_linea_1: "Vibe"                       # sticker sobre la foto
  sticker_linea_2: "Coding + UX"


# --- Datos rápidos (fila bajo el hero) ---------------------------------------
# Puedes agregar o quitar filas copiando o borrando un bloque "- etiqueta / texto".
datos_rapidos:
  - etiqueta: "Especialidad"
    texto: "Product Design con foco en research, contenido e inteligencia artificial."
  - etiqueta: "Industrias"
    texto: "Banca, Retail, Salud, Aerolíneas y Delivery."
  - etiqueta: "Experiencia"
    texto: "+8 años en dominios de UX Design, trabajando con metodologías ágiles."
  - etiqueta: "Enfoque"
    texto: "Integración de IA y prototipado rápido para optimizar flujos de trabajo."


# --- 02 · Proyectos (encabezado de la sección) --------------------------------
# Las tarjetas de cada proyecto se editan en _data/projects.yml
proyectos:
  etiqueta: "Proyectos destacados"
  titulo: "Cada proyecto tiene *una historia que contar*"   # *texto* = subrayado rosa
  bajada: "Diferentes desafíos, decisiones y aprendizajes que reflejan mi forma de entender problemas y transformarlos en experiencias digitales."
  tarjeta_ver_proyecto: "Conocer proyecto"          # enlace que aparece en las tarjetas en celular


# --- 03 · Mi enfoque ----------------------------------------------------------
enfoque:
  etiqueta: "Antes de la primera pantalla"
  titulo: "Entender el problema. *Diseñar la solución*"   # *texto* = subrayado rosa
  bajada: "Las buenas soluciones empiezan con buenas preguntas. Investigo, conecto perspectivas y transformo lo aprendido en experiencias que responden a necesidades reales de las personas usuarias y del negocio."
  # Capacidades: "destacada: true" pinta la tarjeta en rosa con su "marca".
  capacidades:
    - nombre: "Research"
      descripcion: "Investigo y testeo para detectar fricciones y oportunidades que orientan las decisiones."
    - nombre: "Estrategia"
      descripcion: "Colaboro con stakeholders para conectar hallazgos con los objetivos del negocio."
    - nombre: "Diseño"
      descripcion: "transformo hallzgos en flujos, jerarquías y wireframes que simplifican la experiencia."
    - nombre: "Diseño de contenido"
      descripcion: "Integro storytelling y microcopy para construir narrativas que conecten con las necesidades."
      destacada: true
      marca: "Mi sello"


# --- 04 · Contacto y CV -------------------------------------------------------
contacto:
  etiqueta: "Contacto"
  titulo: "¿Conversamos?"
  bajada: "Si te interesa mi trabajo o crees que puedo aportar a tu equipo, me encantará saber de ti."

