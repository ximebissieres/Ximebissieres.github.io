# =============================================================================
#  TEXTOS DE LA HOME · Ximena Bissieres
#  Edita este archivo desde GitHub y haz "Commit changes": la web se actualiza
#  sola en 1 o 2 minutos. Guía completa: GUIA-DE-CONTENIDO.md
#
#  Reglas rápidas
#  - Cambia solo el texto que va después de los dos puntos ( : ).
#  - Si el texto tiene dos puntos ( : ) o empieza con ¿ o ¡, déjalo entre
#    comillas dobles, como ya están en este archivo.
#  - *texto entre asteriscos*  → se destaca en color rosa.
#  - [[texto entre corchetes dobles]]  → se marca en amarillo como "pendiente".
#  - No cambies los nombres de los campos (lo que está antes de los dos puntos)
#    ni los espacios del inicio de cada línea.
# =============================================================================


# --- Pestaña del navegador y buscadores (Google, LinkedIn, WhatsApp) ---------
seo:
  titulo: "Ximena Bissieres · Product Designer"
  descripcion: "Ximena Bissieres, Product Designer especializada en contenido y sistemas. Casos de Monchis, LATAM Airlines, Santa Isabel y Paris Marketplace."


# --- Menú superior (aparece en todas las páginas) ----------------------------
menu:
  saltar_al_contenido: "Saltar al contenido"   # solo visible al navegar con teclado
  marca_iniciales: "X"                          # letra en gris del logo
  marca_iniciales_destacada: "b"                # letra en rosa del logo
  marca_nombre: "Ximena Bissieres"              # nombre junto al logo
  marca_descripcion: "Ximena Bissieres, ir al inicio"   # lo lee el lector de pantalla
  inicio: "Inicio"
  proyectos: "Mis proyectos"
  ver_todos_los_proyectos: "Ver todos los proyectos"
  enfoque: "Mi enfoque"
  contacto: "Contacto"
  boton_movil_abrir: "Menú"                     # botón del menú en celular
  boton_movil_cerrar: "Cerrar"
  nombre_menu_lector: "Principal"               # lo lee el lector de pantalla
  nombre_menu_movil_lector: "Principal (móvil)" # lo lee el lector de pantalla


# --- 01 · Hero: presentación --------------------------------------------------
hero:
  etiqueta: "Product Designer · Research & Content"
  nombre_linea_1: "Ximena"
  nombre_linea_2: "Bissieres"                   # esta línea va en rosa
  bajada: "Identifico oportunidades y transformo problemas complejos en experiencias digitales claras y accesibles, conectando las necesidades de las personas con los objetivos del negocio."
  boton_principal: "Revisar proyectos"
  boton_secundario: "Contacto"
  foto: "/assets/foto.jpg"                      # para cambiar la foto, sube otra con este nombre
  foto_descripcion: "Ximena Bissieres trabajando en su computador, sonriendo y con audífonos"
  foto_iniciales: "XB"                          # se ve solo si la foto no carga


# --- Datos rápidos (fila bajo el hero) ---------------------------------------
# Puedes agregar o quitar filas copiando o borrando un bloque "- etiqueta / texto".
datos_rapidos:
  - etiqueta: "Especialidad"
    texto: "Product Design con foco en research y contenido."
  - etiqueta: "Industrias"
    texto: "Banca, Retail, Salud, aerolíneas y delivery."
  - etiqueta: "He trabajado en"
    texto: "itti, LATAM Airlines, Cencosud, Tenpo, Banco Ripley y más."
  - etiqueta: "Experiencia"
    texto: "+6 años en equipos de producto."


# --- 02 · Proyectos (encabezado de la sección) --------------------------------
# Las tarjetas de cada proyecto se editan en _data/projects.yml
proyectos:
  etiqueta: "Proyectos destacados"
  titulo: "Cuatro proyectos, *cuatro formas* de diseñar un producto"
  bajada: "Cada proyecto tiene un desafío diferente. Aquí comparto cómo abordo problemas reales, las decisiones que impulsé junto a mis equipos y lo que aprendimos en el camino."
  tarjeta_ver_proyecto: "Conocer proyecto"          # enlace que aparece en las tarjetas en celular


# --- 03 · Mi enfoque ----------------------------------------------------------
enfoque:
  etiqueta: "Mi enfoque"
  titulo: "Entender el problema. *Diseñar la solución.*"
  bajada: "Conecto investigación, negocio y diseño para resolver problemas en equipo. El storytelling atraviesa cada etapa del proceso."
  # Capacidades: "destacada: true" pinta la tarjeta en rosa con su "marca".
  capacidades:
    - nombre: "Research"
      descripcion: "Investigo y testeo para detectar fricciones y oportunidades que orientan las decisiones."
    - nombre: "Estrategia"
      descripcion: "Colaboro con stakeholders para conectar hallazgos con los objetivos del negocio."
    - nombre: "Diseño"
      descripcion: "transformo hallzgos en flujos, jerarquías y wireframes que simplifican la experiencia."
    - nombre: "Diseño de contenido"
      descripcion: "Integro storytelling y microcopy para construir narrativas que conecten con las necesidades."
      destacada: true
      marca: "Mi sello"


# --- 04 · Contacto y CV -------------------------------------------------------
contacto:
  etiqueta: "Contacto"
  titulo: "*¿Conversamos?.*"
  bajada: "Si quieres conocer más sobre mi experiencia o conversar sobre un proyecto, escríbeme."

  # Botón principal. Si escribes tu email, el botón abre el correo.
  # Si lo dejas vacío (""), se muestra como pendiente.
  email: ""
  boton_email: "Escríbeme"
  email_pendiente: "[[tu email]]"               # se ve junto al botón mientras no haya email
  mensaje_email_pendiente: "Email pendiente de agregar."

  # CV: sube el PDF a assets/cv/ con este nombre y el botón lo abrirá.
  # Mientras no exista ese PDF, el botón usa cv_enlace_alternativo.
  boton_cv: "Ver mi CV"
  cv_pdf: "/assets/cv/Ximena-Bissieres-CV.pdf"
  cv_enlace_alternativo: "https://drive.google.com/file/d/1nrHjRSnpFOwwXJnKw0vn-z2yrDg4grrt/view"

  # LinkedIn: pega la dirección completa (https://www.linkedin.com/in/...).
  linkedin: ""
  boton_linkedin: "LinkedIn"
  linkedin_pendiente: "[[link]]"


# --- Pie de página (aparece en todas las páginas) ----------------------------
pie:
  izquierda: "© 2026 Ximena Bissieres"
  derecha: "Product Designer · Research & Content"
