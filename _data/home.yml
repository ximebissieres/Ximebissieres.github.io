  # los espacios y el signo + se ignoran al armar el enlace.
  whatsapp: "+56 9 8189 4577"
  boton_whatsapp: "WhatsApp"

  # Correo · botón secundario. Abre el programa de correo (mailto:).
  email: "xime.bissieres@gmail.com"
  boton_email: "Correo"

  # CV · botón secundario. Sube el PDF a assets/cv/ con este nombre y el botón
