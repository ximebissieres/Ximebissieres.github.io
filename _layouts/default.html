<!doctype html>
<html lang="es" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{%- assign seo = site.data.home.seo -%}
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ seo.titulo }}</title>
<meta name="description" content="{{ page.description | default: seo.descripcion | escape }}">
<meta name="theme-color" content="#FFFCFA">
<link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ seo.titulo }}">
<meta property="og:description" content="{{ page.description | default: seo.descripcion | escape }}">
<meta property="og:type" content="website">
{{ page.head_extra }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/styles.css?v={{ site.time | date: '%s' }}">
<script>document.documentElement.classList.replace('no-js', 'js');</script>
</head>
<body class="{{ page.body_class }}">
{% include header.html %}
<main id="contenido">
{{ content }}
</main>
{% include footer.html %}
<script src="/assets/main.js?v={{ site.time | date: '%s' }}" defer></script>
{% if page.body_class == "is-home" %}<script src="/assets/motion.js?v={{ site.time | date: '%s' }}" defer></script>{% endif %}
</body>
</html>
